app = "kora-runtime"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  KORA_DEPLOY_ENV = "prd"
  # HERMES_HOME reconciliation (KR-D-DEPLOY ST1, Option A): the Dockerfile
  # bakes HERMES_HOME=/opt/data, but the Fly volume mounts at /home/hermes/.kora
  # (see [mounts] below). Setting HERMES_HOME here overrides the Docker-layer
  # default at runtime so the daemon writes state onto the persistent volume.
  HERMES_HOME = "/home/hermes/.kora"
  # Daemon listeners bind these inside the container so Fly's internal proxy
  # can reach them. Public exposure is governed entirely by [[services]]
  # blocks (port 9119 internal-only, port 9118 public with TLS).
  KORA_WEB_HOST = "0.0.0.0"
  KORA_WEB_PORT = "9119"
  # SLACK_GATEWAY_ENABLED defaults to "true" inside docker/entrypoint.sh;
  # override per-app via `flyctl secrets set SLACK_GATEWAY_ENABLED=false`
  # if Slack is not provisioned for this environment.

[mounts]
  source = "kora_state"
  destination = "/home/hermes/.kora"
  initial_size = "5gb"

[[services]]
  protocol = "tcp"
  internal_port = 9119
  # No public ports per R2 §5 (control-plane) — the admin web UI is
  # operator-only via `flyctl proxy 9119:9119 -a kora-runtime`.
  # Control-plane traffic is substrate-mediated; this service block
  # exists only to declare the internal port so the TCP healthcheck
  # can reach the dashboard.

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

# Webhook ingress — PUBLIC port 9118 (KR-D-DAEMON ST3).
# Authorized by the R2 §5 amendment in
# kora_docs/00_canonical_current_state/r2_amendments.md (2026-05-22):
# "control-plane stays internal-only; HMAC-verified webhook plane may
# be public on a dedicated port." HMAC is the auth boundary; per-IP
# rate limiting (slowapi) caps flood blast radius.
[[services]]
  protocol = "tcp"
  internal_port = 9118

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/healthz"

[deploy]
  release_command = "hermes doctor"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096
